name: Build and Package

# Deliberately no `push: branches: [master]` trigger: master's branch
# protection requires a PR (force-pushes disallowed, admins enforced too),
# so every commit that lands on master was already built/tested here via
# `pull_request` first, on the exact same tree a merge commit carries
# forward. Nothing downstream consumes this workflow's uploaded artifact
# either (release.yml builds+packages+signs its own .deb independently) --
# a master-push run would just be rebuilding something already verified,
# for no consumer.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Package (resolute/26.04 primary target)
        run: make package

      - name: Install matrix (jammy/22.04, noble/24.04, resolute/26.04)
        run: make matrix

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: apt-cosign-deb
          path: dist/*.deb
          if-no-files-found: error
