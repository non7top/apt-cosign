name: Build and Package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Package (resolute/26.04 primary target)
        run: make package

      - name: Install matrix (jammy/22.04, noble/24.04, resolute/26.04)
        run: make matrix

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: apt-cosign-deb
          path: dist/*.deb
          if-no-files-found: error

  # Only the build job's own artifact is ever released -- never a locally
  # built .deb -- so a release always reflects a package that passed lint,
  # test, and the jammy/noble/resolute install matrix.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apt-cosign-deb
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          prerelease: true
          generate_release_notes: true
