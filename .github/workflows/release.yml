name: Release

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  # Escape hatch to (re)build and publish an already-tagged release without
  # waiting for a new release-please cycle -- e.g. to backfill a release
  # whose assets failed to upload for a reason unrelated to the tag itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build and publish, e.g. v0.2.0"
        required: true

jobs:
  # release-please-action creates its tag/release using the default
  # GITHUB_TOKEN, and GitHub doesn't trigger downstream workflows for refs
  # created that way (an anti-recursion guard) -- so this can't just trigger
  # on push: tags like a normal release workflow would; a completed
  # workflow_run fires regardless of what token the upstream run used.
  # release-please itself runs on every push to master, not just ones that
  # cut a release, so check whether this particular run actually did by
  # looking for a semver tag on its exact commit before building anything.
  check-release-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run doesn't check out the commit that triggered it by
          # default -- it checks out the default branch's current tip,
          # which may have moved on since. Pin to the exact commit
          # release-please just processed. For a manual backfill
          # (workflow_dispatch), deliberately do NOT check out the given
          # tag itself -- the whole point of a backfill is to rebuild with
          # whatever release-process fix just landed on the dispatch ref
          # (normally master), not to reproduce the original build verbatim.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a release tag pointing at this commit
        id: find_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            # grep exits 1 when no tag matches (the normal case for a non-
            # release merge); the || true keeps that from failing this step
            # under -e, since an empty $TAG is the expected, already-handled
            # case (see the `release` job's `if:` below).
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: check-release-tag
    if: needs.check-release-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless apt-cosign-sign signing below exchanges this job's OIDC
      # token for a short-lived Fulcio cert -- no signing key ever touches
      # the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Build and package (resolute/26.04 primary target)
        run: make package

      # Native on the runner, not inside the dev container: apt-cosign-sign
      # needs ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN, which GitHub sets on the
      # job's own environment, not inside a container docker compose run
      # spins up (those aren't forwarded). The binary is a static,
      # CGO_ENABLED=0 build, so it runs directly on the runner with nothing
      # extra installed.
      - name: Sign the .deb (keyless, GitHub Actions OIDC)
        run: ./bin/apt-cosign-sign dist/*.deb

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release-tag.outputs.tag }}
          files: |
            dist/*.deb
            dist/*.deb.sigstore
          generate_release_notes: true
