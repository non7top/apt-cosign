name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please-forecast (release-please-preview.yml) colors this
      # same label on the still-open PR before merge; ensure it exists
      # here too so the very first run has something to color rather than
      # erroring on a missing label. Red is just a safe default for its
      # first creation -- the step below recolors it to match the actual
      # bump on every run.
      - name: Ensure the RELEASE label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create RELEASE --color FF0000 --force --repo "${{ github.repository }}"

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Same technique as release-please-preview.yml: the action's own
      # major/minor/patch outputs only populate once a release is actually
      # tagged, i.e. after this generated PR merges. While it's still open,
      # the changelog heading's compare link in the PR body
      # (".../compare/vOLD...vNEW") is what's available, and is enough to
      # diff ourselves.
      - name: Color the RELEASE label by bump type
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          body=$(echo "$PR_JSON" | jq -r '.body')
          compare=$(echo "$body" | grep -oE '/compare/v[0-9]+\.[0-9]+\.[0-9]+\.\.\.v[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          color=FF0000
          if [ -n "$compare" ]; then
            old_version=$(echo "$compare" | sed -E 's#.*/compare/v([0-9.]+)\.\.\.v.*#\1#')
            new_version=$(echo "$compare" | sed -E 's#.*\.\.\.v([0-9.]+)#\1#')
            IFS='.' read -r old_major old_minor _ <<< "$old_version"
            IFS='.' read -r new_major new_minor _ <<< "$new_version"
            if [ "$new_major" -gt "$old_major" ]; then
              color=D93F0B
            elif [ "$new_minor" -gt "$old_minor" ]; then
              color=FBCA04
            else
              color=0E8A16
            fi
          fi
          gh label edit RELEASE --color "$color" --repo "${{ github.repository }}"
