name: release-please-preview

on:
  pull_request:
    # edited fires on a title/body/base-branch change with no new commits.
    # This repo merges via real merge commits (not squash), so the PR title
    # itself doesn't feed release-please's changelog/version computation --
    # but retargeting a PR's base branch onto (or off of) master does
    # change whether it should be previewed at all, and that's also
    # delivered as `edited`, not `synchronize`. A real rebase/force-push
    # already re-triggers via synchronize on its own.
    types: [opened, synchronize, reopened, edited]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

# Without this, a force-push and a retitle arriving close together start two
# runs that both write this PR's comment/label, and whichever finishes last
# wins -- even when it's the one holding the older PR title. Flagged by
# non7top/release-please-forecast's own preflight check after we hit this
# for real: a stale "Bug Fixes" prediction briefly outran the correct one
# after a force-push. cancel-in-progress so a newer event (another
# force-push) wins outright rather than queuing behind a run whose result
# is already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: release-please needs to walk back to the
          # last release tag, and the action builds its own merge commit on
          # top of this clone.
          fetch-depth: 0

      - uses: non7top/release-please-forecast@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
